<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ICCA - Galería de Arte Interactiva</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Playfair Display & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,800;1,400&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Estilos Personalizados -->
  <link rel="stylesheet" href="/css/galeria.css">
</head>
<body>

  <!-- Línea de límite visual del Nav -->
  <div class="nav-boundary-line" id="navBoundary"></div>

  <!-- Barra de Navegación -->
  <nav class="navbar" id="mainNavbar">
    <div class="nav-brand">
      <h1 class="interactive-word" id="word">
        <span class="letter">I</span>
        <span class="letter">C</span>
        <span class="letter">C</span>
        <span class="letter">A</span>
      </h1>
    </div>

    <ul class="nav-links" id="navLinks">
      <li><a href="index.html">Inicio</a></li>
      <li><a href="galeria.html" class="active">Galería</a></li>
    </ul>

    <div class="nav-contact">
      <a href="/index.html#contacto" class="btn-contacto">Contáctanos</a>
    </div>

    <button class="nav-toggle" id="navToggle" aria-label="Abrir menú">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </nav>

  <!-- Contenedor Lienzo de Galería Libre -->
  <main class="gallery-viewport" id="galleryViewport">
  
    <!-- Contenedor donde se generan las obras de arte -->
    <div id="artContainer"></div>
  </main>

  <!-- Barra Flotante Didáctica / Herramientas -->
  <div class="toolbar-container">
    <div class="counter-pill" id="exploredCounter">
    Exploradas: 0 / n
    </div>

    <button class="tool-btn" id="btnScatter">
      <i class="fa-solid fa-shuffle"></i> Esparcir
    </button>

    <button class="tool-btn" id="btnGrid">
      <i class="fa-solid fa-grip-vertical"></i> Ordenar en Grilla
    </button>

    <div class="h-4 w-[1px] bg-gray-700 mx-1"></div>


  </div>

  <!-- Pantalla Modal Didáctica de Inspección -->
  <div class="modal-overlay" id="artModal">
    <div class="modal-card">
      
      <!-- Botón de Cierre -->
      <button class="modal-close-btn" id="btnCloseModal" aria-label="Cerrar modal">
        <i class="fa-solid fa-xmark text-lg"></i>
      </button>

      <!-- Columna Izquierda: Imagen y Lupa -->
      <div class="modal-img-wrapper" id="imgWrapper">
        <div class="zoom-lens" id="zoomLens"></div>
        <img src="" alt="Obra de Arte" id="modalImg" class="modal-main-img">
        
        <div class="zoom-hint">
          <i class="fa-solid fa-magnifying-glass text-amber-500"></i> Pasa el cursor sobre la obra para zoom
        </div>
      </div>

      <!-- Columna Derecha: Información Didáctica -->
      <div class="modal-content">
        <div>
          <!-- Encabezado de la Obra -->
          <div class="flex items-center gap-2 mb-1">
            <span class="bg-red-950/80 text-red-400 border border-red-800/60 text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 rounded" id="modalMovement"></span>
            <span class="text-gray-400 text-xs" id="modalYear"></span>
          </div>
          <h2 class="font-serif text-2xl md:text-3xl text-amber-100 font-bold leading-tight mb-1" id="modalTitle"></h2>
          <p class="text-amber-500/90 text-sm font-medium mb-4" id="modalArtist"></p>

          <!-- Reproductor Audioguía por Voz -->
          <div class="audio-player-card">
            <button id="btnAudioPlay" class="audio-play-btn">
              <i class="fa-solid fa-play ml-0.5"></i>
            </button>
            <div class="flex-1 min-w-0">
              <div class="flex justify-between items-center text-xs mb-1">
                <span class="font-semibold text-amber-200 flex items-center gap-1">
                  <i class="fa-solid fa-headphones text-red-500"></i> Audioguía Narrada
                </span>
                <span class="text-[10px] text-gray-400" id="audioStatus">Listo para reproducir</span>
              </div>
              <div class="flex items-center gap-1 h-3" id="eqVisualizer">
                <div class="eq-bar" style="animation-delay: 0.1s"></div>
                <div class="eq-bar" style="animation-delay: 0.3s"></div>
                <div class="eq-bar" style="animation-delay: 0.2s"></div>
                <div class="eq-bar" style="animation-delay: 0.4s"></div>
                <div class="eq-bar" style="animation-delay: 0.15s"></div>
                <div class="eq-bar" style="animation-delay: 0.35s"></div>
              </div>
            </div>
          </div>

          <!-- Navegación por pestañas didácticas -->
          <div class="flex border-b border-stone-800 gap-5 mb-4">
            <button class="tab-btn active" data-tab="tab-context">Contexto</button>
            <button class="tab-btn" data-tab="tab-technique">Técnica</button>
            <button class="tab-btn" data-tab="tab-symbolism">Simbolismo</button>
            <button class="tab-btn" data-tab="tab-secrets">Secretos</button>
          </div>

          <!-- Contenido dinámico de las pestañas -->
          <div class="text-sm text-stone-300 leading-relaxed min-h-[130px]" id="tabContent"></div>
        </div>

        <!-- Pie de Modal y Navegador de Obras -->
        <div class="pt-4 border-t border-stone-800 flex items-center justify-between mt-4">
          <div class="text-xs text-gray-500">
            <i class="fa-solid fa-location-dot text-amber-600 mr-1"></i> <span id="modalLocation"></span>
          </div>

          <div class="flex items-center gap-2">
            <button class="modal-nav-btn" id="btnPrevArt">
              <i class="fa-solid fa-chevron-left mr-1"></i> Anterior
            </button>
            <button class="modal-nav-btn" id="btnNextArt">
              Siguiente <i class="fa-solid fa-chevron-right ml-1"></i>
            </button>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Contenido desde el dashboard + lógica -->
  <script src="/cms-data.js"></script>
  <script src="/js/cms.js"></script>
  <script src="/js/galeria.js"></script>
  
</body>
</html>
